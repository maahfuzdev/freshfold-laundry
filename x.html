<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>স্মার্ট কাস্টমার বট</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f2f2f2;
    }

    #container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    #userInput {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #responseBox {
      margin-top: 20px;
      padding: 15px;
      background-color: #e8f5e9;
      border-left: 5px solid #4caf50;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #2196f3;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #0d8bf2;
    }
  </style>
</head>

<body>

  <div id="container">
    <h2>কাস্টমার সহায়তা</h2>
    <input type="text" id="userInput" placeholder="আপনার প্রশ্ন লিখুন..."
      onkeypress="if(event.key === 'Enter') handleInput()" />
    <button onclick="handleInput()">জমা দিন</button>

    <div id="responseBox"></div>
  </div>

  <script>
    const responses = {
      "ironing": "আমাদের দোকানে ইস্ত্রি পরিষেবা প্রদান করা হয়।",
      "delivery": "ডেলিভারি ২-৩ কার্যদিবসের মধ্যে সম্পন্ন হয়।",
      "dry clean": "আমরা ড্রাই ক্লিন পরিষেবাও দিয়ে থাকি।"
    };

    const synonyms = {
      "iron": "ironing",
      "steam": "ironing",
      "press": "ironing",
      "shipping": "delivery",
      "send": "delivery",
      "drop": "delivery",
      "wash": "dry clean",
      "clean": "dry clean"
    };

    function getSmartResponse(query) {
      query = query.toLowerCase();

      // Step 1: Try matching with synonyms
      for (let word in synonyms) {
        if (query.includes(word)) {
          const key = synonyms[word];
          return responses[key];
        }
      }

      // Step 2: Try exact key match
      for (let key of Object.keys(responses)) {
        if (query.includes(key)) {
          return responses[key];
        }
      }

      // Step 3: Fallback
      return "দুঃখিত, এই সম্পর্কে আমার কাছে কোনো তথ্য নেই।";
    }

    function handleInput() {
      const input = document.getElementById("userInput").value;
      const reply = getSmartResponse(input);
      document.getElementById("responseBox").innerHTML = reply;
    }
  </script>

</body>

</html>
